<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Gaegu = tulisan tangan (body), DM Serif Display = judul ala kartu ucapan -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>A Little Gift for You Angga ✨</title>
    <meta
      name="description"
      content="Someone made this just for you. Open this to see your surprise!"
    />

    <!-- OG TAG (preview link di WhatsApp, IG, Telegram, dll).
         GANTI https://DOMAIN-KAMU.com dengan domain asli setelah deploy.
         og:image harus PNG/JPG (WhatsApp & IG tidak baca SVG): export public/og-cover.svg ke
         public/og-cover.png ukuran 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A little gift for you ✨" />
    <meta
      property="og:description"
      content="Someone made this just for you. Open this to see your surprise!"
    />
    <meta
      property="og:image"
      content="https://foryouangga.pages.dev/og-cover.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://foryouangga.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A little gift for you ✨" />
    <meta
      name="twitter:description"
      content="Someone made this just for you. Open this to see your surprise!"
    />
    <meta
      name="twitter:image"
      content="https://foryouangga.pages.dev/og-cover.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
