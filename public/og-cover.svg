<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OG COVER 1200x630 (versi light). Dua tali bunting: HAPPY (atas) + BIRTHDAY (bawah). -->
  <defs>
    <pattern id="denim" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="8" fill="#24344d" opacity=".05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="65%"><stop offset="0" stop-color="#fbfaf5"/><stop offset="1" stop-color="#e8eef4"/></radialGradient>
    <!-- Bentuk bendera: persegi dengan ujung runcing di bawah -->
    <path id="flag" d="M-44 0H44V72L0 108L-44 72Z" stroke="#24344d" stroke-width="3" stroke-linejoin="round"/>
    <!-- Kilau bintang 4 sudut -->
    <path id="spark" d="M0-16C2-6 6-2 16 0 6 2 2 6 0 16-2 6-6 2-16 0-6-2-2-6 0-16Z"/>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#denim)"/>

  <!-- Tali -->
  <path d="M355 178Q600 232 845 180M220 330Q600 395 980 330" fill="none" stroke="#24344d" stroke-width="4" stroke-linecap="round"/>

  <!-- Bendera: translate = posisi di tali, rotate = kemiringan mengikuti lengkung -->
  <g font-family="DM Serif Display, Georgia, serif" font-size="54" font-weight="700" fill="#24344d" text-anchor="middle">
    <g transform="translate(404 188) rotate(10.0)"><use href="#flag" fill="#f3c94f"/><text y="62">H</text></g>
    <g transform="translate(502 201) rotate(5.2)"><use href="#flag" fill="#f2a98c"/><text y="62">A</text></g>
    <g transform="translate(600 206) rotate(0.2)"><use href="#flag" fill="#a9bfa8"/><text y="62">P</text></g>
    <g transform="translate(698 202) rotate(-4.7)"><use href="#flag" fill="#fbfaf5"/><text y="62">P</text></g>
    <g transform="translate(796 189) rotate(-9.6)"><use href="#flag" fill="#f3c94f"/><text y="62">Y</text></g>

    <g transform="translate(268 338) rotate(8.5)"><use href="#flag" fill="#f2a98c"/><text y="62">B</text></g>
    <g transform="translate(362 350) rotate(6.1)"><use href="#flag" fill="#a9bfa8"/><text y="62">I</text></g>
    <g transform="translate(458 358) rotate(3.7)"><use href="#flag" fill="#fbfaf5"/><text y="62">R</text></g>
    <g transform="translate(552 362) rotate(1.2)"><use href="#flag" fill="#f3c94f"/><text y="62">T</text></g>
    <g transform="translate(648 362) rotate(-1.2)"><use href="#flag" fill="#f2a98c"/><text y="62">H</text></g>
    <g transform="translate(742 358) rotate(-3.7)"><use href="#flag" fill="#a9bfa8"/><text y="62">D</text></g>
    <g transform="translate(838 350) rotate(-6.1)"><use href="#flag" fill="#fbfaf5"/><text y="62">A</text></g>
    <g transform="translate(932 338) rotate(-8.5)"><use href="#flag" fill="#f3c94f"/><text y="62">Y</text></g>
  </g>

  <!-- Teks bawah -->
  <text x="600" y="560" text-anchor="middle" font-family="DM Serif Display, Georgia, serif" font-style="italic" font-size="52" fill="#24344d">a little gift for you</text>

  <!-- Kilau dekorasi -->
  <use href="#spark" transform="translate(168 188) scale(1.3)" fill="#f3c94f" stroke="#24344d" stroke-width="1.5"/>
  <use href="#spark" transform="translate(960 126) scale(.7)" fill="#f2a98c" stroke="#24344d" stroke-width="2"/>
  <use href="#spark" transform="translate(1044 414) scale(.9)" fill="#a9bfa8" stroke="#24344d" stroke-width="1.8"/>
  <use href="#spark" transform="translate(130 470) scale(.8)" fill="#f2a98c" stroke="#24344d" stroke-width="2"/>
</svg>
